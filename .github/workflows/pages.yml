name: Demo en GitHub Pages

# Publica la demo estatica de busqueda semantica (carpeta demo/). Corre en el
# navegador del visitante: sin servidor, sin secretos y sin claves de API.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  # Desplegar en un trabajo aparte: en el mismo trabajo, el artefacto recien
  # subido a veces aun no es visible y el despliegue falla con "Found 0 artifact(s)".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
